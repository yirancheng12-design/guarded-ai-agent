name: Portable setup and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m guarded_agent doctor
      - run: python -m guarded_agent demo
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify the installed wheel outside the source directory
        run: >-
          python -c "import pathlib,subprocess,sys,tempfile;
          wheel=next(pathlib.Path('dist').glob('*.whl')).resolve();
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',str(wheel)]);
          scratch=tempfile.mkdtemp(prefix='guarded-wheel-');
          subprocess.check_call([sys.executable,'-m','guarded_agent','doctor'],cwd=scratch);
          subprocess.check_call([sys.executable,'-m','guarded_agent','demo'],cwd=scratch)"
