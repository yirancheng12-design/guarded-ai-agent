[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-agent"
version = "0.4.0"
description = "Local Ollama work agent with verified actions and GitHub repository workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["comtypes==1.4.17", "Pillow==13.0.0"]
assistant = ["playwright==1.64.1", "pypdf==6.21.2", "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2"]

[project.scripts]
guarded-agent = "guarded_agent.cli:main"

[project.urls]
Repository = "https://github.com/yirancheng12-design/guarded-ai-agent"
Issues = "https://github.com/yirancheng12-design/guarded-ai-agent/issues"
Documentation = "https://github.com/yirancheng12-design/guarded-ai-agent/blob/main/docs/setup.md"

[tool.setuptools.packages.find]
include = ["guarded_agent*"]

[tool.setuptools.package-data]
guarded_agent = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
